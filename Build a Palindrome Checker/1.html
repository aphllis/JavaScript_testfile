<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css">
    <title>Palindrome Checker</title>
</head>

<body>
    <main class="container">
        <div class="palindrome-div">
            <label for="text-input">Enter in text to check for a palindrome:</label>
            <input class="palindrome-input" id="text-input" type="text" value>
            <button id="check-btn" class="palindrome-btn">check</button>
            <p id="result" class="user-input"></p>
        </div>
    </main>

    <script src="script.js"></script>
</body>

</html>
